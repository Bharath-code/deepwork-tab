name: release
on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - id: zip
        run: echo "path=$(tools/package.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: deepwork-tab-${{ github.ref_name }}
          path: ${{ steps.zip.outputs.path }}
      - run: gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}

  deploy:
    needs: package
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: Deploy heartbeat Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: heartbeat
        run: npx --yes wrangler@4 deploy
      - name: Deploy site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: |
          cp ../shared/tokens.css .
          npx --yes wrangler@4 deploy
      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipped Worker and site deploy."
