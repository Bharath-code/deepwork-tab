<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Popup frame</title>
<link rel="stylesheet" href="/shared/tokens.css">
<style>
  body { height: 100vh; display: grid; place-items: center; background: var(--ground); }
  iframe { width: 360px; height: 540px; border: 1px solid var(--line); border-radius: 14px; transform: scale(1.35); background: var(--surface); box-shadow: var(--glass-shadow); }
</style>
<iframe id="f" title="DeepWork Tab popup"></iframe>
<script>
  const f = document.getElementById('f');
  f.addEventListener('load', () => setTimeout(() => (f.style.height = `${f.contentDocument.body.scrollHeight}px`), 600));
  f.src = '/popup/popup.html' + location.search;
</script>
</html>
