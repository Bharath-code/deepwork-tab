<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="gauge">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="label"><span id="count" class="num"></span><span class="muted"> / <span id="cap" class="num"></span> tabs</span></span>
      <span id="streak" class="streak muted" hidden></span>
    </div>
    <button id="settingsBtn" class="ghost">Settings</button>
  </header>

  <section id="receipt" class="receipt" hidden>
    <h2>This week</h2>
    <dl class="receipt-rows">
      <div><dt>Intercepts</dt><dd id="rIntercepts" class="num">0</dd></div>
      <div><dt>Tabs queued</dt><dd id="rQueued" class="num">0</dd></div>
      <div id="rTopRow" hidden><dt>Top distraction</dt><dd id="rTop"></dd></div>
    </dl>
    <!-- The only upgrade surface in the product. Never the intercept. -->
    <a class="upsell" href="https://deepwork-tab.kumarbharath63.workers.dev/#pricing" target="_blank" rel="noopener">Still losing the afternoon to one site? →</a>
  </section>

  <section>
    <h2>Queued for later</h2>
    <ul id="queue"></ul>
    <p id="snoozedNote" class="muted" hidden></p>
    <div id="snoozeMenu" class="snooze-menu" hidden></div>
    <p id="empty" class="muted" hidden>Nothing queued. Good sign.</p>
    <button id="exportBtn" class="ghost" hidden>Copy queue as markdown</button>
    <p id="status" class="sr-only" role="status"></p>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
