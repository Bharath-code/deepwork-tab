<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The one thing</title>
  <link rel="preload" href="../shared/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../shared/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="ritual.css">
</head>
<body>
  <div class="field" aria-hidden="true"></div>
  <main>
    <section id="ask">
      <h1 class="ask rf" tabindex="-1">Good morning. What's the one thing today?</h1>
      <p class="lede rf-row" style="--i:0">The one that makes everything else easier, or unnecessary.</p>
      <p id="carried" class="carried rf-row" style="--i:0" hidden>Carried from yesterday</p>
      <label class="rf-row" style="--i:1">
        <span class="sr-only">Today's one thing</span>
        <textarea id="thing" class="thing" rows="1" maxlength="140" spellcheck="true" placeholder="finish the migration script"></textarea>
      </label>
      <p id="count" class="count num" aria-hidden="true"></p>
      <div class="actions rf-row" style="--i:2">
        <button id="save" class="primary">Set it <kbd>↵</kbd></button>
        <button id="skip" class="ghost">Not today <kbd>esc</kbd></button>
      </div>
    </section>
    <section id="done" hidden>
      <p class="set"><span class="dot" aria-hidden="true"></span><span id="saved" class="voice"></span></p>
      <p class="lede">Saved for today.</p>
    </section>
    <p id="status" class="sr-only" role="status"></p>
  </main>
  <script type="module" src="onething.js"></script>
</body>
</html>
